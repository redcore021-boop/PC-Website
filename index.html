<title>מאזן קלוריות</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="מאזן">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Secular+One&display=swap">
<style>
/* Layout: one phone-width column; sticky header, scrolling view, fixed tab bar with a raised add button. */
:root{
  --bg:#F2F5F1; --surface:#FFFFFF; --sunk:#E8EDE7; --ink:#15201A; --muted:#5B6961; --line:#DCE3DB;
  --accent:#1D7A54; --accent-ink:#FFFFFF; --accent-soft:#DFF0E6;
  --carb:#C9821A; --prot:#3463C4; --fat:#BC4A84; --ex:#1F8796; --warn:#C2432C; --water:#2F86C9;
  --shadow:0 1px 2px rgba(20,40,30,.06),0 6px 20px rgba(20,40,30,.06);
  --f-display:"Secular One","Assistant",system-ui,sans-serif;
  --f-body:"Assistant",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1411; --surface:#171F1B; --sunk:#202A25; --ink:#E6EEE9; --muted:#93A39A; --line:#29342E;
  --accent:#4DC18F; --accent-ink:#06130D; --accent-soft:#1A3328;
  --carb:#E3A645; --prot:#709AEE; --fat:#E27DB0; --ex:#4CB8C6; --warn:#EE7A62; --water:#5AAEEB;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1411; --surface:#171F1B; --sunk:#202A25; --ink:#E6EEE9; --muted:#93A39A; --line:#29342E;
  --accent:#4DC18F; --accent-ink:#06130D; --accent-soft:#1A3328;
  --carb:#E3A645; --prot:#709AEE; --fat:#E27DB0; --ex:#4CB8C6; --warn:#EE7A62; --water:#5AAEEB;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}

#app{max-width:520px;margin:0 auto;min-height:100%;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 10px;
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-size:24px;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:22px;height:22px;border-radius:50%;background:conic-gradient(var(--accent) 0 70%,var(--sunk) 0)}
.top small{color:var(--muted);font-size:14px}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}

.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.card h2{font-family:var(--f-display);font-weight:400;font-size:19px;margin:0}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.lbl{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:700}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:11px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.plain{background:var(--sunk);color:var(--ink)}
.btn.danger{background:transparent;color:var(--warn);border:1.5px solid var(--warn)}
.btn.block{width:100%}
.link{color:var(--accent);font-weight:700}

.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:14px}

/* calories */
.cal{display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:center}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring b{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1}
.ring span{font-size:13px;color:var(--muted)}
.trk{fill:none;stroke:var(--sunk)}
.prog{fill:none;stroke:var(--accent);stroke-linecap:round;transition:stroke-dasharray .5s ease}
.prog.over{stroke:var(--warn)}
.eq{display:flex;flex-direction:column;gap:8px}
.eq div{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:15px}
.eq div b{font-variant-numeric:tabular-nums;font-size:17px}
.eq .tot{border-top:1px solid var(--line);padding-top:8px}
.eq .tot b{color:var(--accent);font-size:19px}
.eq .tot b.neg{color:var(--warn)}

.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.mac .bar{height:7px;border-radius:9px;background:var(--sunk);overflow:hidden;margin-block:6px 4px}
.mac .bar i{display:block;height:100%;border-radius:9px}
.mac .t{font-size:13px;font-weight:700}
.mac .v{font-size:13px;color:var(--muted)}

.water{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.glass{width:34px;height:42px;border-radius:6px 6px 10px 10px;border:2px solid var(--water);position:relative;overflow:hidden;opacity:.55}
.glass.full{opacity:1}
.glass.full::after{content:"";position:absolute;inset:auto 0 0 0;height:72%;background:var(--water)}

.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.quick button{background:var(--surface);box-shadow:var(--shadow);border-radius:14px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:14px}
.quick svg{width:24px;height:24px}

/* diary */
.datebar{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:6px}
.datebar button.arrow{width:40px;height:40px;border-radius:10px;display:grid;place-items:center}
.datebar button.arrow:active{background:var(--sunk)}
.datebar .d{font-weight:800;text-align:center}
.datebar .d small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.strip{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;gap:4px;font-size:12px;color:var(--muted)}
.strip b{display:block;font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.strip .r b{color:var(--accent)}
.strip .r b.neg{color:var(--warn)}
.meal{padding:0;overflow:hidden}
.meal .mh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 10px}
.meal .mh b{font-variant-numeric:tabular-nums}
.item{display:flex;justify-content:space-between;gap:12px;padding:10px 16px;border-top:1px solid var(--line);width:100%;text-align:start}
.item:active{background:var(--sunk)}
.item .n{min-width:0}
.item .n div{font-weight:600;overflow-wrap:anywhere}
.item .n small{color:var(--muted);font-size:13px}
.item .k{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.addrow{display:block;width:100%;text-align:start;padding:12px 16px;border-top:1px solid var(--line);color:var(--accent);font-weight:800;font-size:14px;letter-spacing:.03em}
.empty{padding:2px 16px 12px;color:var(--muted);font-size:14px}

/* progress */
.chart svg{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.chart .wl{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .wa{fill:var(--accent);opacity:.12}
.chart .dot{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .dot.last{fill:var(--accent)}
.chart .bar{fill:var(--accent)}
.chart .bar.over{fill:var(--warn)}
.chart .bar.none{fill:var(--sunk)}
.chart .goal{stroke:var(--muted);stroke-dasharray:4 4;stroke-width:1.2}
.chart .tag{fill:var(--ink);font-size:11px;font-weight:700;font-family:var(--f-body)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font-family:var(--f-display);font-weight:400;font-size:22px;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted)}
.wlist .item{padding-inline:0}

/* profile */
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:13px;color:var(--muted);font-weight:700}
.field input,.field select{width:100%;background:var(--sunk);border:1.5px solid transparent;border-radius:10px;padding:10px 12px;font-size:16px}
.field input:focus,.field select:focus{border-color:var(--accent);outline:none}
.seg{display:flex;background:var(--sunk);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 4px;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.calc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;background:var(--sunk);border-radius:12px;padding:12px}
.calc b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.calc span{font-size:12px;color:var(--muted)}
.calc .g b{color:var(--accent)}

/* tab bar */
nav.tabs{position:fixed;inset:auto 0 0 0;z-index:10;background:var(--surface);border-top:1px solid var(--line);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);padding-block:4px}
nav.tabs button.on{color:var(--accent)}
nav.tabs svg{width:24px;height:24px}
nav.tabs .plus{width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin:-22px auto 0;box-shadow:0 6px 16px rgba(29,122,84,.35)}
nav.tabs .plus svg{width:28px;height:28px}

/* sheet */
#scrim{position:fixed;inset:0;z-index:20;background:rgba(8,14,11,.45);opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;inset:auto 0 0 0;z-index:21;max-width:520px;margin:0 auto;background:var(--bg);border-radius:20px 20px 0 0;
  max-height:88%;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .25s ease;
  padding-bottom:env(safe-area-inset-bottom,0px)}
#sheet.on{transform:none}
#sheet .grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:8px auto 2px;flex:none}
#sheet .sh{display:flex;align-items:center;justify-content:space-between;padding:6px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));flex:none}
#sheet .sh h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:20px}
#sheet .sb{overflow-y:auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.x{width:34px;height:34px;border-radius:50%;background:var(--sunk);display:grid;place-items:center}
.search{position:relative}
.search input{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 40px 12px 12px;font-size:16px}
.search input:focus{border-color:var(--accent);outline:none}
.search svg{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted)}
.list{background:var(--surface);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.list .item:first-child{border-top:0}
.list .item .k small{display:block;font-weight:400;color:var(--muted);font-size:12px;text-align:end}
.big{font-family:var(--f-display);font-size:40px;text-align:center;line-height:1}
.stepper{display:flex;align-items:center;justify-content:center;gap:14px}
.stepper button{width:46px;height:46px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:24px;font-weight:800}
.stepper input{width:90px;text-align:center;font-size:22px;font-weight:800;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:8px}
.mrow{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;background:var(--surface);border-radius:14px;padding:12px 6px;box-shadow:var(--shadow)}
.mrow b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.mrow span{font-size:12px;font-weight:700}
.note{font-size:12px;color:var(--muted)}

/* barcode scanner */
.cam{position:relative;border-radius:16px;overflow:hidden;background:#0B0F0D;width:100%;height:0;padding-bottom:62%;flex:none}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.cam .frame{position:absolute;inset:26% 9%;border:3px solid rgba(255,255,255,.9);border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.cam .frame::after{content:"";position:absolute;left:6%;right:6%;top:50%;height:2px;background:#FF5A4E;box-shadow:0 0 8px #FF5A4E;animation:scan 1.6s ease-in-out infinite alternate}
@keyframes scan{from{transform:translateY(-34px)}to{transform:translateY(34px)}}
.cam .msg{position:absolute;inset:auto 0 10px 0;text-align:center;color:#fff;font-size:14px;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.camctl{position:absolute;top:10px;inset-inline-start:10px;display:flex;gap:8px}
.camctl button{min-width:44px;height:36px;padding:0 12px;border-radius:18px;background:rgba(0,0,0,.55);color:#fff;font-weight:800;font-size:13px}
.camctl button.on{background:#fff;color:#111}
.scanbtn{display:flex;align-items:center;gap:12px;background:var(--surface);box-shadow:var(--shadow);border-radius:14px;padding:12px 14px;text-align:start;width:100%}
.scanbtn svg{width:30px;height:30px;color:var(--accent);flex:none}
.scanbtn b{display:block}
.scanbtn small{color:var(--muted);font-size:13px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.status{background:var(--accent-soft);border-radius:12px;padding:10px 14px;font-size:14px}
.status.err{background:var(--sunk);border-inline-start:4px solid var(--warn)}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--sunk);border-top-color:var(--accent);animation:sp 0.8s linear infinite;margin:6px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.quick{grid-template-columns:repeat(4,1fr)}
.quick button{font-size:13px}

#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:360px){.cal{grid-template-columns:1fr;justify-items:center}.eq{width:100%}}
</style>

<div dir="rtl" lang="he">
<div id="app">
  <header class="top"><div class="brand"><i aria-hidden="true"></i>מאזן</div><small id="hdate"></small></header>
  <main id="view"></main>
</div>

<nav class="tabs" aria-label="ניווט ראשי"><div class="in">
  <button data-act="tab" data-v="home" id="t-home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>בית</button>
  <button data-act="tab" data-v="diary" id="t-diary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h12a2 2 0 0 1 2 2v16H7a2 2 0 0 1-2-2z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>יומן</button>
  <button data-act="add" aria-label="הוספת מזון"><span class="plus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span></button>
  <button data-act="tab" data-v="progress" id="t-progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"/><path d="M4 16l5-5 4 3 7-8"/></svg>התקדמות</button>
  <button data-act="tab" data-v="me" id="t-me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>פרופיל</button>
</div></nav>

<div id="scrim" data-act="close"></div>
<section id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle">
  <div class="grab"></div>
  <div class="sh"><h3 id="shTitle"></h3><button class="x" data-act="close" aria-label="סגירה"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="sb" id="shBody"></div>
</section>
<div id="toast" role="status"></div>
</div>

  add(t,"b","oats",1);add(t,"b","banana",1);add(t,"b","latte",1);

  menus.forEach((m,i)=>{const k=shift(t,-(i+1));m.forEach((id,j)=>add(k,j<2?"b":j<4?"l":"d",id,1));S.days[k].water=4+(i%4)});

function goals(){
  const p=S.profile, w=curWeight();
  const bmr=10*w+6.25*p.height-5*p.age+(p.sex==="m"?5:-161);
  const tdee=bmr*p.activity;
  const floor=p.sex==="m"?1500:1200;
  const kcal=Math.max(floor,Math.round((tdee+p.rate*7700/7)/10)*10);
  const sp=SPLITS[p.split]||SPLITS.balanced;
  return {bmr:Math.round(bmr),tdee:Math.round(tdee),kcal,p:Math.round(kcal*sp[1]/100/4),c:Math.round(kcal*sp[2]/100/4),f:Math.round(kcal*sp[3]/100/9),floored:kcal===floor};
}
function totals(k){
  const d=getDay(k), t={kcal:0,p:0,c:0,f:0,ex:0};
  d.food.forEach(i=>{t.kcal+=i.kcal*i.sv;t.p+=i.p*i.sv;t.c+=i.c*i.sv;t.f+=i.f*i.sv});
  d.ex.forEach(e=>t.ex+=e.kcal);
  return t;
}

function ring(eaten,goal){
  const R=56,C=2*Math.PI*R,pct=Math.min(eaten/goal,1);
  return `<svg viewBox="0 0 132 132" aria-hidden="true"><circle class="trk" cx="66" cy="66" r="${R}" stroke-width="12"/><circle class="prog ${eaten>goal?"over":""}" cx="66" cy="66" r="${R}" stroke-width="12" stroke-dasharray="${(C*pct).toFixed(1)} ${C.toFixed(1)}"/></svg>`;
}
function calCard(k){
  const g=goals(),t=totals(k),rem=g.kcal-t.kcal+t.ex;
  return `<section class="card"><div class="row between" style="margin-bottom:12px"><h2>קלוריות</h2><span class="muted" style="font-size:13px">נותרו = יעד − מזון + פעילות</span></div>
  <div class="cal"><div class="ring">${ring(t.kcal,g.kcal+t.ex)}<div class="c"><b class="num">${fmt(Math.abs(rem))}</b><span>${rem>=0?"נותרו":"חריגה"}</span></div></div>
  <div class="eq"><div><span class="muted">יעד יומי</span><b>${fmt(g.kcal)}</b></div><div><span class="muted">מזון</span><b>${fmt(t.kcal)}</b></div><div><span class="muted">פעילות</span><b>+${fmt(t.ex)}</b></div><div class="tot"><span>נותרו</span><b class="${rem<0?"neg":""}">${fmt(rem)}</b></div></div></div></section>`;
}
function macroCard(k){
  const g=goals(),t=totals(k);
  const m=(name,v,goal,col)=>`<div class="mac"><div class="t" style="color:var(${col})">${name}</div><div class="bar"><i style="width:${Math.min(100,v/goal*100).toFixed(0)}%;background:var(${col})"></i></div><div class="v num">${Math.round(v)} / ${goal} ג'</div></div>`;
  return `<section class="card"><h2 style="margin-bottom:10px">רכיבים תזונתיים</h2><div class="macros">${m("פחמימות",t.c,g.c,"--carb")}${m("חלבון",t.p,g.p,"--prot")}${m("שומן",t.f,g.f,"--fat")}</div></section>`;
}
function waterCard(k){
  const n=getDay(k).water, goal=S.profile.water;
  let gl="";for(let i=0;i<Math.max(goal,n+1);i++)gl+=`<button class="glass ${i<n?"full":""}" data-act="water" data-n="${i<n&&i===n-1?i:i+1}" aria-label="${i+1} כוסות"></button>`;

function weightChart(){
  const pts=S.weights.slice().sort((a,b)=>a.date<b.date?-1:1);
  if(pts.length<2)return `<div class="empty" style="padding:10px 0">צריך לפחות שתי שקילות כדי לראות גרף.</div>`;
  const W=320,H=170,L=34,R=12,T=14,B=24;
  const t0=parse(pts[0].date).getTime(), t1=parse(pts[pts.length-1].date).getTime()||t0+1;
  let lo=Math.min(...pts.map(p=>p.kg)), hi=Math.max(...pts.map(p=>p.kg));
  lo=Math.floor(lo*2)/2-0.5; hi=Math.ceil(hi*2)/2+0.5;
  const step=(hi-lo)>6?2:(hi-lo)>3?1:0.5;
  lo=Math.floor(lo/step)*step; hi=Math.ceil(hi/step)*step;
  const x=d=>L+(parse(d).getTime()-t0)/((t1-t0)||1)*(W-L-R), y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  let g="";for(let v=lo;v<=hi+1e-9;v+=step)g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${L-6}" y="${y(v)+3}" text-anchor="end">${r1(v)}</text>`;
  const line=pts.map((p,i)=>(i?"L":"M")+x(p.date).toFixed(1)+" "+y(p.kg).toFixed(1)).join(" ");
  const area=line+` L${x(pts[pts.length-1].date).toFixed(1)} ${H-B} L${L} ${H-B} Z`;
  const dots=pts.map((p,i)=>`<circle class="dot ${i===pts.length-1?"last":""}" cx="${x(p.date).toFixed(1)}" cy="${y(p.kg).toFixed(1)}" r="${i===pts.length-1?4.5:3}"/>`).join("");
  const lp=pts[pts.length-1], short=k=>parse(k).toLocaleDateString("he-IL",{day:"numeric",month:"numeric"});
  return `<div class="chart" dir="ltr"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="גרף משקל">${g}<path class="wa" d="${area}"/><path class="wl" d="${line}"/>${dots}
  <text class="tag" x="${Math.min(x(lp.date),W-R-4)}" y="${y(lp.kg)-9}" text-anchor="end">${lp.kg}</text>
  <text class="axis" x="${L}" y="${H-6}">${short(pts[0].date)}</text><text class="axis" x="${W-R}" y="${H-6}" text-anchor="end">${short(lp.date)}</text></svg></div>`;
}
function weekChart(){
  const g=goals().kcal, days=[];for(let i=6;i>=0;i--)days.push(shift(today(),-i));
  const vals=days.map(k=>totals(k).kcal), max=Math.max(g*1.25,...vals);
  const W=320,H=160,T=12,B=22,bw=26,gap=(W-7*bw)/8, y=v=>T+(1-v/max)*(H-T-B);
  const names=["א","ב","ג","ד","ה","ו","ש"];
  let b="";days.forEach((k,i)=>{const v=vals[i],xx=gap+i*(bw+gap);
    // right-to-left: today on the left would feel wrong in Hebrew, so mirror order

/* ---------- barcode scanning ---------- */
const ZX_SRC="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js";
let zxLoad=null, scanning=false, stream=null, scanTimer=0, zx=null, lastRead="", torchOn=false;
function loadZX(){
  if(window.ZXing)return Promise.resolve(window.ZXing);
  return zxLoad||(zxLoad=new Promise((ok,no)=>{const s=document.createElement("script");s.src=ZX_SRC;s.onload=()=>ok(window.ZXing);s.onerror=()=>{zxLoad=null;no(new Error("load"))};document.head.appendChild(s)}));
}
/* one decoder, reused for every frame */
function decoder(ZX){
  if(zx)return zx;
  const h=new Map();
  h.set(ZX.DecodeHintType.POSSIBLE_FORMATS,[ZX.BarcodeFormat.EAN_13,ZX.BarcodeFormat.EAN_8,ZX.BarcodeFormat.UPC_A,ZX.BarcodeFormat.UPC_E,ZX.BarcodeFormat.CODE_128]);
  h.set(ZX.DecodeHintType.TRY_HARDER,true);
  const r=new ZX.MultiFormatReader();r.setHints(h);
  return zx={ZX,r};
}
/* try to read a barcode from a canvas: both binarizers, then inverted */
function decodeCanvas(cv){
  const {ZX,r}=zx;
  const src=new ZX.HTMLCanvasElementLuminanceSource(cv);
  const tries=[()=>new ZX.BinaryBitmap(new ZX.HybridBinarizer(src)),()=>new ZX.BinaryBitmap(new ZX.GlobalHistogramBinarizer(src)),()=>new ZX.BinaryBitmap(new ZX.HybridBinarizer(new ZX.InvertedLuminanceSource(src)))];
  for(const t of tries){try{return r.decodeWithState(t()).getText()}catch(e){}finally{r.reset()}}
  return null;
}
/* draw a region of an image/video onto a canvas, optionally rotated 90° */
function drawRegion(cv,src,sx,sy,sw,sh,maxW,rot){
  const k=Math.min(1,maxW/sw), w=Math.round(sw*k), h=Math.round(sh*k);
  cv.width=rot?h:w;cv.height=rot?w:h;
  const c=cv.getContext("2d",{willReadFrequently:true});
  c.save();if(rot){c.translate(h,0);c.rotate(Math.PI/2)}
  c.drawImage(src,sx,sy,sw,sh,0,0,w,h);c.restore();
}
/* EAN/UPC check digit, so a misread never reaches the lookup */
function validCode(s){
  if(!/^\d+$/.test(s))return false;
  if(![8,12,13].includes(s.length))return s.length>=6;
  const d=s.split("").map(Number),chk=d.pop();
  const sum=d.reverse().reduce((a,x,i)=>a+x*(i%2?1:3),0);
  return (10-sum%10)%10===chk;
}
function stopScan(){
  scanning=false;clearTimeout(scanTimer);torchOn=false;
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
}
function scanStatus(msg,err){const s=$("#scanSt");if(s){s.innerHTML=msg;s.className="status"+(err?" err":"");s.hidden=!msg}}
function openScan(){
  openSheet("סריקת ברקוד",`<div class="cam" id="cam"><video id="camv" playsinline muted autoplay></video><div class="frame"></div><div class="msg" id="camMsg">מכוונים את הברקוד למסגרת, במרחק של כ-15 ס"מ</div>
    <div class="camctl"><button id="torch" data-act="torch" hidden aria-label="פנס">פנס</button><button id="zoom" data-act="zoom" hidden aria-label="זום">2×</button></div></div>
  <div class="status" id="scanSt" hidden></div>
  <label class="btn ghost block filebtn" for="snap">צילום תמונה של הברקוד<input id="snap" type="file" accept="image/*" capture="environment"></label>
  <div class="row" style="gap:8px"><div class="field" style="flex:1"><label for="bc-in">או הקלדת מספר הברקוד</label><input id="bc-in" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="7290000066318" autocomplete="off"></div><button class="btn" style="align-self:flex-end" data-act="bcgo">חיפוש</button></div>
  <p class="note" style="margin:0">הנתונים מגיעים ממאגר Open Food Facts. מוצר שנסרק נשמר ב"המזונות שלי", כך שבפעם הבאה הוא נמצא מיד.</p>`,b=>{
    b.querySelector("#snap").addEventListener("change",e=>{const f=e.target.files&&e.target.files[0];if(f)scanPhoto(f);e.target.value=""});
    b.querySelector("#bc-in").addEventListener("keydown",e=>{if(e.key==="Enter")lookupInput()});
    startLive();
  });
}
async function startLive(){
  const cam=$("#cam");
  const noLive=()=>{stopScan();if(cam)cam.hidden=true;scanStatus("המצלמה החיה לא זמינה כאן. צלמו את הברקוד עם הכפתור למטה, האייפון יפתח את המצלמה.")};
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return noLive();
  let ZX;try{ZX=await loadZX()}catch(e){return noLive()}
  decoder(ZX);
  const v=$("#camv");if(!v)return;
  stopScan();
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080}}});
  }catch(e){return noLive()}
  if(!$("#camv")){stopScan();return}
  v.srcObject=stream;try{await v.play()}catch(e){}
  const track=stream.getVideoTracks()[0], caps=track.getCapabilities?track.getCapabilities():{};
  try{if(caps.focusMode&&caps.focusMode.includes("continuous"))await track.applyConstraints({advanced:[{focusMode:"continuous"}]})}catch(e){}
  if(caps.torch)$("#torch").hidden=false;
  if(caps.zoom&&caps.zoom.max>=2)$("#zoom").hidden=false;
  scanning=true;lastRead="";
  const cv=document.createElement("canvas");let n=0;
  const tick=()=>{
    if(!scanning)return;
    if(v.readyState>=2&&v.videoWidth){
      const W=v.videoWidth,H=v.videoHeight;n++;
      // the part of the video visible in the wide box (object-fit: cover), then the frame inside it, with a margin
      const box=v.getBoundingClientRect(), R=box.width/(box.height||1);
      let vw=W,vh=H;if(W/H>R)vw=H*R;else vh=W/R;
      const vx=(W-vw)/2,vy=(H-vh)/2;
      // every third pass reads the whole visible area rotated, for a barcode held upright
      const code=n%3===0?(drawRegion(cv,v,vx,vy,vw,vh,900,true),decodeCanvas(cv)):(drawRegion(cv,v,vx+vw*0.04,vy+vh*0.18,vw*0.92,vh*0.64,1000,false),decodeCanvas(cv));
      if(code){
        // a valid check digit is enough; anything else must be read twice in a row
        if(validCode(code)&&([8,12,13].includes(code.length)||code===lastRead)){stopScan();found(code);return}
        lastRead=code;
      }
    }
    scanTimer=setTimeout(tick,90);
  };
  tick();
  setTimeout(()=>{if(scanning&&$("#camMsg"))$("#camMsg").textContent="לא מזהה? נסו להתרחק מעט, להדליק פנס או לצלם תמונה"},9000);
}
async function scanPhoto(file){
  stopScan();
  scanStatus('<div class="spin"></div><div style="text-align:center">מזהה ברקוד בתמונה…</div>');
  let ZX;try{ZX=await loadZX()}catch(e){return scanStatus("לא הצלחתי לטעון את רכיב הסריקה. בדקו את החיבור לאינטרנט, או הקלידו את המספר.",true)}
  decoder(ZX);
  const url=URL.createObjectURL(file), img=new Image();
  try{await new Promise((ok,no)=>{img.onload=ok;img.onerror=no;img.src=url})}catch(e){URL.revokeObjectURL(url);return scanStatus("לא הצלחתי לפתוח את התמונה.",true)}
  await new Promise(r=>setTimeout(r,30));
  const W=img.naturalWidth,H=img.naturalHeight,cv=document.createElement("canvas");
  // several sizes and crops: phone photos are large and the barcode is often small or sideways
  const plans=[[0,0,1,1,1400],[0,0,1,1,900],[.15,.2,.7,.6,1200],[.25,.3,.5,.4,1000],[0,0,1,1,2000]];
  let code=null;
  outer:for(const rot of [false,true])for(const [x,y,w,h,m] of plans){
    drawRegion(cv,img,W*x,H*y,W*w,H*h,m,rot);
    code=decodeCanvas(cv);if(code)break outer;
  }
  URL.revokeObjectURL(url);
  if(code)found(code);
  else scanStatus("לא זוהה ברקוד בתמונה. צלמו שוב כשהברקוד ממלא את רוב התמונה, ישר, חד ובלי השתקפות אור. אפשר גם להקליד את המספר.",true);
}
function lookupInput(){const v=($("#bc-in").value||"").replace(/\D/g,"");if(v.length<8){scanStatus("ברקוד צריך להכיל לפחות 8 ספרות.",true);return}found(v)}
function found(code){try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}lookup(code)}
/* the same product can be stored as UPC-A (12 digits) or EAN-13 with a leading 0 */
function codeVariants(c){const v=[c];if(c.length===12)v.push("0"+c);if(c.length===13&&c[0]==="0")v.push(c.slice(1));if(c.length===8)v.push("00000"+c);return v}
async function offFetch(code){
  const ctl=new AbortController(), t=setTimeout(()=>ctl.abort(),9000);
  try{const r=await fetch("https://world.openfoodfacts.org/api/v2/product/"+encodeURIComponent(code)+".json?fields=product_name,product_name_he,generic_name,brands,quantity,serving_size,serving_quantity,nutriments",{signal:ctl.signal});return await r.json()}
  finally{clearTimeout(t)}
}

async function lookup(code){
  stopScan();
  const vars=codeVariants(code), mine=S.custom.find(f=>vars.includes(f.barcode));
  if(mine){pushRecent(mine.id);openFood(mine,null,"המוצר נמצא ב\"המזונות שלי\".");return}
  openSheet("מחפש מוצר",`<div class="spin"></div><p style="text-align:center;margin:0">מחפש את ברקוד <span class="num">${esc(code)}</span>…</p>`);
  let data=null, net=false, partial=null;
  for(const c of vars){
    try{const d=await offFetch(c);net=true;
      if(d&&d.status===1){const n=d.product.nutriments||{};if(n["energy-kcal_100g"]!=null||n["energy-kj_100g"]!=null){data=d;break}partial=partial||d}
    }catch(e){}
  }
  data=data||partial;
  if(!$("#sheet").classList.contains("on"))return;
  const p=data&&data.status===1&&data.product, f=p&&offFood(code,p);
  if(f){S.custom.unshift(f);pushRecent(f.id);save();openFood(f,null,"המוצר נמצא. הערכים נלקחו מהמאגר, כדאי להשוות לתווית.");return}
  openNewFood({barcode:code,name:p?offName(p):"",
    msg:!net?"אין כרגע גישה למאגר המוצרים. מלאו את הערכים מהתווית פעם אחת, והמוצר יזוהה בסריקה הבאה."
      :p?"המוצר נמצא, אבל בלי ערכים תזונתיים. מלאו אותם מהתווית פעם אחת והם יישמרו."
      :"המוצר לא נמצא במאגר. מלאו את הערכים מהתווית פעם אחת והם יישמרו לסריקה הבאה."});
}
function offName(p){const n=(p.product_name_he||p.product_name||p.generic_name||"").trim(),b=(p.brands||"").split(",")[0].trim();return n&&b&&!n.includes(b)?n+" · "+b:(n||b)}
function offFood(code,p){
  const n=p.nutriments||{}, v=k=>{const x=parseFloat(n[k]);return isNaN(x)?null:x};
  let k100=v("energy-kcal_100g"); if(k100==null&&v("energy-kj_100g")!=null)k100=v("energy-kj_100g")/4.184;
  if(k100==null)return null;
  const per={kcal:k100,p:v("proteins_100g")||0,c:v("carbohydrates_100g")||0,f:v("fat_100g")||0};
  const sq=parseFloat(p.serving_quantity), g=sq>0&&sq<2000?sq:100, m=g/100;
  return {id:"c_"+uid(),barcode:code,name:offName(p)||"מוצר "+code,
    unit:g===100?"100 ג'":"מנה ("+(p.serving_size&&!/[a-z]/i.test(p.serving_size)?p.serving_size:r1(g)+" ג'")+")",g,
    kcal:Math.round(per.kcal*m),p:r1(per.p*m),c:r1(per.c*m),f:r1(per.f*m)};
}
function openExercise(){
  openSheet("הוספת פעילות",`<div class="field"><label for="ex-type">סוג פעילות</label><select id="ex-type">${ACTS.map((a,i)=>`<option value="${i}">${a[0]}</option>`).join("")}</select></div>
  <div class="field"><label for="ex-min">משך (דקות)</label><input id="ex-min" type="number" inputmode="numeric" value="30" min="1"></div>
  <div class="big num" id="ex-k"></div><div class="muted" style="text-align:center;margin-top:-8px;font-size:14px">קלוריות שנשרפו (הערכה)</div>
  <button class="btn block" data-act="exsave">הוספה ליומן</button>`,b=>{
    const upd=()=>{b.querySelector("#ex-k").textContent=fmt(exKcal())};
    b.querySelector("#ex-type").addEventListener("change",upd);b.querySelector("#ex-min").addEventListener("input",upd);upd();
  });
}
function exKcal(){const a=ACTS[+$("#ex-type").value],m=parseFloat($("#ex-min").value)||0;return Math.round(a[1]*curWeight()*m/60)}
function openWeigh(){
  openSheet("שקילה",`<div class="form"><div class="field"><label for="w-kg">משקל (ק"ג)</label><input id="w-kg" type="number" inputmode="decimal" step="0.1" value="${curWeight()}"></div>
  <div class="field"><label for="w-date">תאריך</label><input id="w-date" type="date" value="${today()}" max="${today()}"></div></div>
  <button class="btn block" data-act="wsave">שמירה</button>`,b=>b.querySelector("#w-kg").select());
}
function openConfirmClear(){
  openSheet("התחלה נקייה",`<p style="margin:0">היומן, הפעילות, השקילות והמזונות שיצרת יימחקו. הפרטים האישיים והיעדים יישארו.</p>
  <button class="btn danger block" data-act="clearyes">מחיקה והתחלה מחדש</button><button class="btn plain block" data-act="close">ביטול</button>`);
}

function pushRecent(id){S.recent=[id].concat(S.recent.filter(x=>x!==id)).slice(0,20)}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  const a=el.dataset.act, num=v=>parseFloat(v)||0;
  switch(a){
    case "tab":view=el.dataset.v;if(view==="diary")cur=cur||today();try{localStorage.setItem(LS+".tab",view)}catch(_){}render();window.scrollTo(0,0);break;
    case "add":addMeal=el.dataset.meal||(view==="diary"?addMeal:guessMeal());if(view!=="diary")cur=today();openAdd();break;
    case "close":closeSheet();break;
    case "meal":addMeal=el.dataset.v;document.querySelectorAll("#mealSeg button").forEach(b=>b.classList.toggle("on",b===el));break;
    case "src":addTab=el.dataset.v;document.querySelectorAll("#srcSeg button").forEach(b=>b.classList.toggle("on",b===el));$("#results").innerHTML=foodRows($("#q").value);break;
    case "pick":{const f=allFoods().find(x=>x.id===el.dataset.id);if(f)openFood(f);break}
    case "sv":{const i=$("#sv"),g=pending.mode==="g";i.value=Math.max(g?5:0.5,r1(num(i.value)+num(el.dataset.n)*(g?10:0.5)));i.dispatchEvent(new Event("input"));break}
    case "unit":{if(pending.mode===el.dataset.v)break;const i=$("#sv"),s=amount();pending.mode=el.dataset.v;
      i.value=pending.mode==="g"?Math.round(s*pending.f.g):r1(s);i.step=pending.mode==="g"?"10":"0.5";
      document.querySelectorAll("#unitSeg button").forEach(b=>b.classList.toggle("on",b===el));i.dispatchEvent(new Event("input"));break}
    case "scan":if(view!=="diary")cur=today();if(!el.closest("#sheet"))addMeal=view==="diary"?addMeal:guessMeal();openScan();break;
    case "bcgo":lookupInput();break;
    case "torch":{if(!stream)break;torchOn=!torchOn;stream.getVideoTracks()[0].applyConstraints({advanced:[{torch:torchOn}]}).catch(()=>{});el.classList.toggle("on",torchOn);break}
    case "zoom":{if(!stream)break;const t=stream.getVideoTracks()[0],z=el.classList.toggle("on")?2:1;t.applyConstraints({advanced:[{zoom:z}]}).catch(()=>{});el.textContent=z===2?"1×":"2×";break}
    case "lookup":lookup(el.dataset.code);break;
    case "confirm":{const sv=Math.round(amount()*1000)/1000;if(sv<=0)return;const f=pending.f;
      day(cur).food.push({id:uid(),fid:f.id,name:f.name,unit:f.unit,g:f.g,kcal:f.kcal,p:f.p,c:f.c,f:f.f,sv,meal:$("#fmeal").value});
      pushRecent(f.id);closeSheet();commit(`${f.name} נוסף ליומן`);break}
    case "edit":{const it=getDay(cur).food.find(i=>i.id===el.dataset.id);if(it)openFood({name:it.name,unit:it.unit,g:it.g,kcal:it.kcal,p:it.p,c:it.c,f:it.f},it);break}
    case "saveitem":{const sv=Math.round(amount()*1000)/1000;if(sv<=0)return;pending.edit.sv=sv;pending.edit.meal=$("#fmeal").value;closeSheet();commit("עודכן");break}
    case "delitem":{const d=day(cur);d.food=d.food.filter(i=>i!==pending.edit);closeSheet();commit("הוסר מהיומן");break}
    case "quickadd":openQuick();break;
    case "quicksave":{const k=num($("#qa-k").value);if(k<=0){$("#qa-k").focus();return}
      day(cur).food.push({id:uid(),name:$("#qa-name").value.trim()||"הוספה מהירה",unit:"מנה",kcal:k,p:num($("#qa-p").value),c:num($("#qa-c").value),f:num($("#qa-f").value),sv:1,meal:$("#qa-meal").value});
      closeSheet();commit("נוסף ליומן");break}
    case "newfood":openNewFood();break;
    case "newfoodsave":{const n=$("#nf-name").value.trim(),k=num($("#nf-k").value);if(!n||k<=0){$("#nf-err").hidden=false;return}
      const bc=$("#nf-bc")?$("#nf-bc").value.replace(/\D/g,""):"", g=num($("#nf-g").value);
      const f={id:"c_"+uid(),name:n,unit:$("#nf-unit").value.trim()||"מנה",kcal:k,p:num($("#nf-p").value),c:num($("#nf-c").value),f:num($("#nf-f").value)};
      if(g>0)f.g=g;if(bc){f.barcode=bc;S.custom=S.custom.filter(x=>x.barcode!==bc)}
      S.custom.unshift(f);pushRecent(f.id);save();openFood(f);break}
    case "exercise":if(view!=="diary")cur=today();openExercise();break;
    case "exsave":{const m=num($("#ex-min").value);if(m<=0)return;day(cur).ex.push({id:uid(),name:ACTS[+$("#ex-type").value][0],min:m,kcal:exKcal()});closeSheet();commit("הפעילות נרשמה");break}
    case "exdel":{const d=day(cur);d.ex=d.ex.filter(x=>x.id!==el.dataset.id);commit("הפעילות נמחקה");break}
    case "water":{const k=view==="diary"?cur:today();const n=+el.dataset.n;day(k).water=getDay(k).water===n?n-1:n;commit();break}
    case "weigh":openWeigh();break;
    case "wsave":{const kg=num($("#w-kg").value),dt=$("#w-date").value||today();if(kg<25||kg>400){$("#w-kg").focus();return}
      S.weights=S.weights.filter(w=>w.date!==dt);S.weights.push({date:dt,kg:r1(kg)});closeSheet();commit("השקילה נשמרה");break}
    case "wdel":S.weights=S.weights.filter(w=>w.date!==el.dataset.d);commit("השקילה נמחקה");break;
    case "day":cur=shift(cur,+el.dataset.n);render();break;
    case "sex":S.profile.sex=el.dataset.v;commit();break;
    case "clear":openConfirmClear();break;
    case "clearyes":S.days={};S.weights=[];S.custom=[];S.recent=[];S.sample=false;closeSheet();view="me";commit("היומן נוקה. עדכן/י את הפרטים שלך");break;
  }
});
document.addEventListener("change",e=>{
  const el=e.target;if(!el.dataset||!el.dataset.k)return;
  const k=el.dataset.k;let v=el.value;
  if(k==="split")S.profile.split=v;
  else if(k==="target")S.profile.target=parseFloat(v)||null;
  else{v=parseFloat(v);if(isNaN(v))return;S.profile[k]=v}
  commit("נשמר");
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
function guessMeal(){const h=new Date().getHours();return h<11?"b":h<16?"l":h<21?"d":"s"}

render();
})();
</script>
